<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pens · Bamboo</title>
  <meta name="description" content="2 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Pens · Bamboo</h1>
        <p>2 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/pens/bamboo/metal/">Metal <span>2</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/pens/bamboo/metal/ancona-bamboo-inkless-pen/" data-name="ancona bamboo inkless pen" data-plu="122427" data-material="metal">
      <img src="/assets/products/122427/122427-1-8302124a.webp" alt="Ancona Bamboo Inkless Pen" loading="lazy">
      <div><h2>Ancona Bamboo Inkless Pen</h2><p>PLU 122427</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/pens/bamboo/metal/infinity-inkless-bamboo-pen/" data-name="infinity inkless bamboo pen" data-plu="129411" data-material="metal">
      <img src="/assets/products/129411/129411-1-8aaa695e.webp" alt="Infinity Inkless Bamboo Pen" loading="lazy">
      <div><h2>Infinity Inkless Bamboo Pen</h2><p>PLU 129411</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
