<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pens · Blue Refill</title>
  <meta name="description" content="3 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Pens · Blue Refill</h1>
        <p>3 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/pens/blue-refill/plastic/">Plastic <span>2</span></a><a href="/catalogue/pens/blue-refill/metal/">Metal <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/pens/blue-refill/plastic/habitat-pen/" data-name="habitat pen" data-plu="116298" data-material="plastic">
      <img src="/assets/products/116298/116298-1-65dfd103.webp" alt="Habitat Pen" loading="lazy">
      <div><h2>Habitat Pen</h2><p>PLU 116298</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/pens/blue-refill/plastic/trinity-bamboo-pen/" data-name="trinity bamboo pen" data-plu="117410" data-material="plastic">
      <img src="/assets/products/117410/117410-1-4be0a72a.webp" alt="Trinity Bamboo Pen" loading="lazy">
      <div><h2>Trinity Bamboo Pen</h2><p>PLU 117410</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/pens/blue-refill/metal/swiss-peak-a5-notebook-and-pen-set/" data-name="swiss peak a5 notebook and pen set" data-plu="120861" data-material="metal">
      <img src="/assets/products/120861/120861-1-d19ef509.webp" alt="Swiss Peak A5 Notebook and Pen Set" loading="lazy">
      <div><h2>Swiss Peak A5 Notebook and Pen Set</h2><p>PLU 120861</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
