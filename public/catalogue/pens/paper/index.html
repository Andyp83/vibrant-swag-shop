<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pens · Paper</title>
  <meta name="description" content="5 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Pens · Paper</h1>
        <p>5 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/pens/paper/plastic/">Plastic <span>4</span></a><a href="/catalogue/pens/paper/metal/">Metal <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/pens/paper/plastic/kraft-pen/" data-name="kraft pen" data-plu="104358" data-material="plastic">
      <img src="/assets/products/104358/104358-2-13d92e4a.webp" alt="Kraft Pen" loading="lazy">
      <div><h2>Kraft Pen</h2><p>PLU 104358</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/pens/paper/plastic/inca-pen/" data-name="inca pen" data-plu="116301" data-material="plastic">
      <img src="/assets/products/116301/116301-1-7dd43590.webp" alt="Inca Pen" loading="lazy">
      <div><h2>Inca Pen</h2><p>PLU 116301</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/pens/paper/metal/infinity-inkless-kraft-pen/" data-name="infinity inkless kraft pen" data-plu="121633" data-material="metal">
      <img src="/assets/products/121633/121633-1-c36fefe7.webp" alt="Infinity Inkless Kraft Pen" loading="lazy">
      <div><h2>Infinity Inkless Kraft Pen</h2><p>PLU 121633</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/pens/paper/plastic/choice-kraft-pen/" data-name="choice kraft pen" data-plu="121837" data-material="plastic">
      <img src="/assets/products/121837/121837-1-d83e920c.webp" alt="Choice Kraft Pen" loading="lazy">
      <div><h2>Choice Kraft Pen</h2><p>PLU 121837</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/pens/paper/plastic/lancer-kraft-pen/" data-name="lancer kraft pen" data-plu="124948" data-material="plastic">
      <img src="/assets/products/124948/124948-1-d483b6a3.webp" alt="Lancer Kraft Pen" loading="lazy">
      <div><h2>Lancer Kraft Pen</h2><p>PLU 124948</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
