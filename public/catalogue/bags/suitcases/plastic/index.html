<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suitcases · Plastic</title>
  <meta name="description" content="2 products in Bags / Suitcases / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Suitcases · Plastic</h1>
        <p>2 products in Bags / Suitcases / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/bags/suitcases/plastic/rollink-flex-earth-suitcase-small/" data-name="rollink flex earth suitcase - small" data-plu="126632" data-material="plastic">
      <img src="/assets/products/126632/126632-1-4bb5793d.webp" alt="Rollink Flex Earth Suitcase - Small" loading="lazy">
      <div><h2>Rollink Flex Earth Suitcase - Small</h2><p>PLU 126632</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/bags/suitcases/plastic/rollink-flex-earth-suitcase-medium/" data-name="rollink flex earth suitcase - medium" data-plu="126633" data-material="plastic">
      <img src="/assets/products/126633/126633-2-c3b5920f.webp" alt="Rollink Flex Earth Suitcase - Medium" loading="lazy">
      <div><h2>Rollink Flex Earth Suitcase - Medium</h2><p>PLU 126633</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
