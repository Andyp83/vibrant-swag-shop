<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duffle Bags · Metal</title>
  <meta name="description" content="3 products in Bags / Duffle Bags / Metal.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Duffle Bags · Metal</h1>
        <p>3 products in Bags / Duffle Bags / Metal.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/bags/duffle-bags/metal/excelsior-duffle-bag/" data-name="excelsior duffle bag" data-plu="111606" data-material="metal">
      <img src="/assets/products/111606/111606-1-c62f6a37.webp" alt="Excelsior Duffle Bag" loading="lazy">
      <div><h2>Excelsior Duffle Bag</h2><p>PLU 111606</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/bags/duffle-bags/metal/spice-waste2gear-weekend-sports-bag/" data-name="spice waste2gear weekend sports bag" data-plu="126953" data-material="metal">
      <img src="/assets/products/126953/126953-1-edc60c8c.webp" alt="SPICE Waste2Gear Weekend Sports Bag" loading="lazy">
      <div><h2>SPICE Waste2Gear Weekend Sports Bag</h2><p>PLU 126953</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/bags/duffle-bags/metal/archer-copenhagen-canvas-duffle-bag/" data-name="archer copenhagen canvas duffle bag" data-plu="128384" data-material="metal">
      <img src="/assets/products/128384/128384-1-493465cd.webp" alt="ARCHER Copenhagen Canvas Duffle Bag" loading="lazy">
      <div><h2>ARCHER Copenhagen Canvas Duffle Bag</h2><p>PLU 128384</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
