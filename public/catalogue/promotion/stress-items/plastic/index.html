<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stress Items · Plastic</title>
  <meta name="description" content="2 products in Promotion / Stress Items / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Stress Items · Plastic</h1>
        <p>2 products in Promotion / Stress Items / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/promotion/stress-items/plastic/stress-slime/" data-name="stress slime" data-plu="118789" data-material="plastic">
      <img src="/assets/products/118789/118789-1-6ab57d8e.webp" alt="Stress Slime" loading="lazy">
      <div><h2>Stress Slime</h2><p>PLU 118789</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/promotion/stress-items/plastic/fidget-popper-board-square/" data-name="fidget popper board - square" data-plu="124013" data-material="plastic">
      <img src="/assets/products/124013/124013-1-bda063f1.webp" alt="Fidget Popper Board - Square" loading="lazy">
      <div><h2>Fidget Popper Board - Square</h2><p>PLU 124013</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
