<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Bottle Openers · Paper &amp; Cardboard</h1>
        <p>2 products in Promotion / Bottle Openers / Paper &amp; Cardboard.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/promotion/bottle-openers/paper-and-cardboard/natura-bamboo-fridge-bottle-opener/" data-name="natura bamboo fridge bottle opener" data-plu="124702" data-material="paper-and-cardboard">
      <img src="/assets/products/124702/124702-1-1101ef07.webp" alt="NATURA Bamboo Fridge Bottle Opener" loading="lazy">
      <div><h2>NATURA Bamboo Fridge Bottle Opener</h2><p>PLU 124702</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/promotion/bottle-openers/paper-and-cardboard/natura-bamboo-wall-mounted-bottle-opener/" data-name="natura bamboo wall mounted bottle opener" data-plu="124703" data-material="paper-and-cardboard">
      <img src="/assets/products/124703/124703-1-441ef801.webp" alt="NATURA Bamboo Wall Mounted Bottle Opener" loading="lazy">
      <div><h2>NATURA Bamboo Wall Mounted Bottle Opener</h2><p>PLU 124703</p><p>Paper &amp; Cardboard</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
