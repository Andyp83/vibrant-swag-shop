<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotional · General</title>
  <meta name="description" content="3 products in Promotion / Promotional / General.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Promotional · General</h1>
        <p>3 products in Promotion / Promotional / General.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/promotion/promotional/general/30cm-balloons/" data-name="30cm balloons" data-plu="107102" data-material="general">
      <img src="/assets/products/107102/107102-1-fa326681.webp" alt="30cm Balloons" loading="lazy">
      <div><h2>30cm Balloons</h2><p>PLU 107102</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/promotion/promotional/general/hi-bounce-ball/" data-name="hi-bounce ball" data-plu="120585" data-material="general">
      <img src="/assets/products/120585/120585-1-f5983615.webp" alt="Hi-Bounce Ball" loading="lazy">
      <div><h2>Hi-Bounce Ball</h2><p>PLU 120585</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/promotion/promotional/general/foam-supporters-hand/" data-name="foam supporters hand" data-plu="125064" data-material="general">
      <img src="/assets/products/125064/125064-1-f934695d.webp" alt="Foam Supporters Hand" loading="lazy">
      <div><h2>Foam Supporters Hand</h2><p>PLU 125064</p><p>General</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
