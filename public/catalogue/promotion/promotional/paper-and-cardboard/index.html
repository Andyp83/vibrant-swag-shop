<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotional · Paper &amp; Cardboard</title>
  <meta name="description" content="2 products in Promotion / Promotional / Paper &amp; Cardboard.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Promotional · Paper &amp; Cardboard</h1>
        <p>2 products in Promotion / Promotional / Paper &amp; Cardboard.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/promotion/promotional/paper-and-cardboard/car-air-freshener/" data-name="car air freshener" data-plu="107100" data-material="paper-and-cardboard">
      <img src="/assets/products/107100/107100-1-721b60cc.webp" alt="Car Air Freshener" loading="lazy">
      <div><h2>Car Air Freshener</h2><p>PLU 107100</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/promotion/promotional/paper-and-cardboard/sunburn-alert-stickers/" data-name="sunburn alert stickers" data-plu="119392" data-material="paper-and-cardboard">
      <img src="/assets/products/119392/119392-1-c0c1af1d.webp" alt="Sunburn Alert Stickers" loading="lazy">
      <div><h2>Sunburn Alert Stickers</h2><p>PLU 119392</p><p>Paper &amp; Cardboard</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
