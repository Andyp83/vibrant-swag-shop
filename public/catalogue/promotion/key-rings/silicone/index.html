<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Key Rings · Silicone</title>
  <meta name="description" content="3 products in Promotion / Key Rings / Silicone.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Key Rings · Silicone</h1>
        <p>3 products in Promotion / Key Rings / Silicone.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/promotion/key-rings/silicone/silicone-key-ring/" data-name="silicone key ring" data-plu="118532" data-material="silicone">
      <img src="/assets/products/118532/118532-1-f2a8351c.webp" alt="Silicone Key Ring" loading="lazy">
      <div><h2>Silicone Key Ring</h2><p>PLU 118532</p><p>Silicone</p></div>
    </a><a class="product-card" href="/catalogue/promotion/key-rings/silicone/silicone-key-ring-debossed/" data-name="silicone key ring - debossed" data-plu="118671" data-material="silicone">
      <img src="/assets/products/118671/118671-1-fe51c83c.webp" alt="Silicone Key Ring - Debossed" loading="lazy">
      <div><h2>Silicone Key Ring - Debossed</h2><p>PLU 118671</p><p>Silicone</p></div>
    </a><a class="product-card" href="/catalogue/promotion/key-rings/silicone/silicone-key-ring-embossed/" data-name="silicone key ring - embossed" data-plu="118672" data-material="silicone">
      <img src="/assets/products/118672/118672-1-176e3679.webp" alt="Silicone Key Ring - Embossed" loading="lazy">
      <div><h2>Silicone Key Ring - Embossed</h2><p>PLU 118672</p><p>Silicone</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
