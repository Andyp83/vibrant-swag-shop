<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apparel Accessories · Plastic</title>
  <meta name="description" content="2 products in Apparel / Apparel Accessories / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Apparel Accessories · Plastic</h1>
        <p>2 products in Apparel / Apparel Accessories / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/apparel/apparel-accessories/plastic/custom-shoe-charms-4-pack/" data-name="custom shoe charms - 4 pack" data-plu="127385" data-material="plastic">
      <img src="/assets/products/127385/127385-1-f1049b4d.webp" alt="Custom Shoe Charms - 4 Pack" loading="lazy">
      <div><h2>Custom Shoe Charms - 4 Pack</h2><p>PLU 127385</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/apparel/apparel-accessories/plastic/custom-shoe-charms-6-pack/" data-name="custom shoe charms - 6 pack" data-plu="127386" data-material="plastic">
      <img src="/assets/products/127386/127386-1-587a7483.webp" alt="Custom Shoe Charms - 6 Pack" loading="lazy">
      <div><h2>Custom Shoe Charms - 6 Pack</h2><p>PLU 127386</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
