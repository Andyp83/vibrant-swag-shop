<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polos · Plastic</title>
  <meta name="description" content="2 products in Apparel / Polos / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Polos · Plastic</h1>
        <p>2 products in Apparel / Polos / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/apparel/polos/plastic/trendswear-ace-performance-mens-polo/" data-name="trendswear ace performance men&#x27;s polo" data-plu="122046" data-material="plastic">
      <img src="/assets/products/122046/122046-1-fe239d31.webp" alt="TRENDSWEAR Ace Performance Men&#x27;s Polo" loading="lazy">
      <div><h2>TRENDSWEAR Ace Performance Men&#x27;s Polo</h2><p>PLU 122046</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/apparel/polos/plastic/trendswear-ace-performance-womens-polo/" data-name="trendswear ace performance women&#x27;s polo" data-plu="122047" data-material="plastic">
      <img src="/assets/products/122047/122047-1-f2372ec6.webp" alt="TRENDSWEAR Ace Performance Women&#x27;s Polo" loading="lazy">
      <div><h2>TRENDSWEAR Ace Performance Women&#x27;s Polo</h2><p>PLU 122047</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
