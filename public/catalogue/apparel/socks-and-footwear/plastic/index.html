<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socks &amp; Footwear · Plastic</title>
  <meta name="description" content="2 products in Apparel / Socks &amp; Footwear / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Socks &amp; Footwear · Plastic</h1>
        <p>2 products in Apparel / Socks &amp; Footwear / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/apparel/socks-and-footwear/plastic/tidal-flip-flops/" data-name="tidal flip flops" data-plu="126043" data-material="plastic">
      <img src="/assets/products/126043/126043-1-8ca8d12a.webp" alt="Tidal Flip Flops" loading="lazy">
      <div><h2>Tidal Flip Flops</h2><p>PLU 126043</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/apparel/socks-and-footwear/plastic/fiji-flip-flops/" data-name="fiji flip flops" data-plu="126044" data-material="plastic">
      <img src="/assets/products/126044/126044-1-c064c87e.webp" alt="Fiji Flip Flops" loading="lazy">
      <div><h2>Fiji Flip Flops</h2><p>PLU 126044</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
