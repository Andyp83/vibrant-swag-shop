<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakers · Leather &amp; PU</title>
  <meta name="description" content="2 products in Technology / Speakers / Leather &amp; PU.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Speakers · Leather &amp; PU</h1>
        <p>2 products in Technology / Speakers / Leather &amp; PU.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/speakers/leather-and-pu/icarus-speaker-wireless-charger/" data-name="icarus speaker wireless charger" data-plu="116962" data-material="leather-and-pu">
      <img src="/assets/products/116962/116962-1-08dce976.webp" alt="Icarus Speaker Wireless Charger" loading="lazy">
      <div><h2>Icarus Speaker Wireless Charger</h2><p>PLU 116962</p><p>Leather &amp; PU</p></div>
    </a><a class="product-card" href="/catalogue/technology/speakers/leather-and-pu/zulu-speaker-wireless-charger/" data-name="zulu speaker wireless charger" data-plu="116963" data-material="leather-and-pu">
      <img src="/assets/products/116963/116963-1-a0d4f72b.webp" alt="Zulu Speaker Wireless Charger" loading="lazy">
      <div><h2>Zulu Speaker Wireless Charger</h2><p>PLU 116963</p><p>Leather &amp; PU</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
