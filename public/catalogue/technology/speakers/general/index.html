<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakers · General</title>
  <meta name="description" content="3 products in Technology / Speakers / General.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Speakers · General</h1>
        <p>3 products in Technology / Speakers / General.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/speakers/general/polaris-bluetooth-speaker/" data-name="polaris bluetooth speaker" data-plu="107692" data-material="general">
      <img src="/assets/products/107692/107692-1-ecc0ad45.webp" alt="Polaris Bluetooth Speaker" loading="lazy">
      <div><h2>Polaris Bluetooth Speaker</h2><p>PLU 107692</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/technology/speakers/general/terrain-outdoor-bluetooth-speaker/" data-name="terrain outdoor bluetooth speaker" data-plu="119572" data-material="general">
      <img src="/assets/products/119572/119572-1-78f49f3b.webp" alt="Terrain Outdoor Bluetooth Speaker" loading="lazy">
      <div><h2>Terrain Outdoor Bluetooth Speaker</h2><p>PLU 119572</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/technology/speakers/general/polaris-bluetooth-speaker-sale/" data-name="polaris bluetooth speaker - sale" data-plu="129175" data-material="general">
      <img src="/assets/products/129175/129175-1-ada9a911.webp" alt="Polaris Bluetooth Speaker - Sale" loading="lazy">
      <div><h2>Polaris Bluetooth Speaker - Sale</h2><p>PLU 129175</p><p>General</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
