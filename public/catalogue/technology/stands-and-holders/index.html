<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technology · Stands &amp; Holders</title>
  <meta name="description" content="3 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Technology · Stands &amp; Holders</h1>
        <p>3 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/technology/stands-and-holders/plastic/">Plastic <span>2</span></a><a href="/catalogue/technology/stands-and-holders/metal/">Metal <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/stands-and-holders/plastic/transit-car-phone-holder/" data-name="transit car phone holder" data-plu="110043" data-material="plastic">
      <img src="/assets/products/110043/110043-1-63acb310.webp" alt="Transit Car Phone Holder" loading="lazy">
      <div><h2>Transit Car Phone Holder</h2><p>PLU 110043</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/technology/stands-and-holders/metal/nuvo-magnetic-phone-holder/" data-name="nuvo magnetic phone holder" data-plu="112831" data-material="metal">
      <img src="/assets/products/112831/112831-1-0cbd2324.webp" alt="Nuvo Magnetic Phone Holder" loading="lazy">
      <div><h2>Nuvo Magnetic Phone Holder</h2><p>PLU 112831</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/technology/stands-and-holders/plastic/zamora-car-phone-holder/" data-name="zamora car phone holder" data-plu="116033" data-material="plastic">
      <img src="/assets/products/116033/116033-1-176d4885.webp" alt="Zamora Car Phone Holder" loading="lazy">
      <div><h2>Zamora Car Phone Holder</h2><p>PLU 116033</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
