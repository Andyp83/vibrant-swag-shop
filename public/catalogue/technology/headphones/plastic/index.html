<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headphones · Plastic</title>
  <meta name="description" content="2 products in Technology / Headphones / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Headphones · Plastic</h1>
        <p>2 products in Technology / Headphones / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/headphones/plastic/skullcandy-hesh-360-headphones/" data-name="skullcandy hesh 360 headphones" data-plu="133429" data-material="plastic">
      <img src="/assets/products/133429/133429-1-ed95fcce.webp" alt="Skullcandy Hesh 360 Headphones" loading="lazy">
      <div><h2>Skullcandy Hesh 360 Headphones</h2><p>PLU 133429</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/technology/headphones/plastic/skullcandy-icon-180-wireless-headphones/" data-name="skullcandy icon 180 wireless headphones" data-plu="133811" data-material="plastic">
      <img src="/assets/products/133811/133811-1-024adb6a.webp" alt="Skullcandy Icon 180 Wireless Headphones" loading="lazy">
      <div><h2>Skullcandy Icon 180 Wireless Headphones</h2><p>PLU 133811</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
