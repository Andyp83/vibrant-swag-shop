<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headphones · Leather &amp; PU</title>
  <meta name="description" content="2 products in Technology / Headphones / Leather &amp; PU.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Headphones · Leather &amp; PU</h1>
        <p>2 products in Technology / Headphones / Leather &amp; PU.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/headphones/leather-and-pu/pulsar-headphones/" data-name="pulsar headphones" data-plu="106926" data-material="leather-and-pu">
      <img src="/assets/products/106926/106926-10-2829f871.webp" alt="Pulsar Headphones" loading="lazy">
      <div><h2>Pulsar Headphones</h2><p>PLU 106926</p><p>Leather &amp; PU</p></div>
    </a><a class="product-card" href="/catalogue/technology/headphones/leather-and-pu/opus-bluetooth-headphones/" data-name="opus bluetooth headphones" data-plu="112785" data-material="leather-and-pu">
      <img src="/assets/products/112785/112785-1-38a39eeb.webp" alt="Opus Bluetooth Headphones" loading="lazy">
      <div><h2>Opus Bluetooth Headphones</h2><p>PLU 112785</p><p>Leather &amp; PU</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
