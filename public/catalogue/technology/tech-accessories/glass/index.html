<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Accessories · Glass</title>
  <meta name="description" content="2 products in Technology / Tech Accessories / Glass.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Tech Accessories · Glass</h1>
        <p>2 products in Technology / Tech Accessories / Glass.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/tech-accessories/glass/full-colour-microfibre-pouch/" data-name="full colour microfibre pouch" data-plu="106379" data-material="glass">
      <img src="/assets/products/106379/106379-1-fa966b8d.webp" alt="Full Colour Microfibre Pouch" loading="lazy">
      <div><h2>Full Colour Microfibre Pouch</h2><p>PLU 106379</p><p>Glass</p></div>
    </a><a class="product-card" href="/catalogue/technology/tech-accessories/glass/ingenio-arc-wireless-car-charger/" data-name="ingenio arc wireless car charger" data-plu="127077" data-material="glass">
      <img src="/assets/products/127077/127077-1-add110f6.webp" alt="INGENIO Arc Wireless Car Charger" loading="lazy">
      <div><h2>INGENIO Arc Wireless Car Charger</h2><p>PLU 127077</p><p>Glass</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
