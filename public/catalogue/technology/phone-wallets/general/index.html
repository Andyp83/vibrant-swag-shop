<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Wallets · General</title>
  <meta name="description" content="2 products in Technology / Phone Wallets / General.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Phone Wallets · General</h1>
        <p>2 products in Technology / Phone Wallets / General.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/phone-wallets/general/lycra-phone-wallet-full-colour/" data-name="lycra phone wallet - full colour" data-plu="110520" data-material="general">
      <img src="/assets/products/110520/110520-1-d4e9e37d.webp" alt="Lycra Phone Wallet - Full Colour" loading="lazy">
      <div><h2>Lycra Phone Wallet - Full Colour</h2><p>PLU 110520</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/technology/phone-wallets/general/lycra-phone-wallet-heat-transfer/" data-name="lycra phone wallet - heat transfer" data-plu="111762" data-material="general">
      <img src="/assets/products/111762/111762-1-76d740bc.webp" alt="Lycra Phone Wallet - Heat Transfer" loading="lazy">
      <div><h2>Lycra Phone Wallet - Heat Transfer</h2><p>PLU 111762</p><p>General</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
