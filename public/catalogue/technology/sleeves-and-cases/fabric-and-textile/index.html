<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>

    <main>
      <section class="catalogue-head">
        <h1>Sleeves &amp; Cases · Fabric &amp; Textile</h1>
        <p>3 products in Technology / Sleeves &amp; Cases / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/technology/sleeves-and-cases/fabric-and-textile/spencer-phone-pouch/" data-name="spencer phone pouch" data-plu="123557" data-material="fabric-and-textile">
      <img src="/assets/products/123557/123557-1-f460dc1e.webp" alt="Spencer Phone Pouch" loading="lazy">
      <div><h2>Spencer Phone Pouch</h2><p>PLU 123557</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/technology/sleeves-and-cases/fabric-and-textile/knight-phone-pouch/" data-name="knight phone pouch" data-plu="123716" data-material="fabric-and-textile">
      <img src="/assets/products/123716/123716-1-1d02b907.webp" alt="Knight Phone Pouch" loading="lazy">
      <div><h2>Knight Phone Pouch</h2><p>PLU 123716</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/technology/sleeves-and-cases/fabric-and-textile/spencer-phone-sleeve/" data-name="spencer phone sleeve" data-plu="124011" data-material="fabric-and-textile">
      <img src="/assets/products/124011/124011-1-2b831957.webp" alt="Spencer Phone Sleeve" loading="lazy">
      <div><h2>Spencer Phone Sleeve</h2><p>PLU 124011</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
