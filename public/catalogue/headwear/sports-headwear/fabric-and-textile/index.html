<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Headwear · Fabric &amp; Textile</title>
  <meta name="description" content="2 products in Headwear / Sports Headwear / Fabric &amp; Textile.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Sports Headwear · Fabric &amp; Textile</h1>
        <p>2 products in Headwear / Sports Headwear / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/headwear/sports-headwear/fabric-and-textile/orlando-sun-visor/" data-name="orlando sun visor" data-plu="112570" data-material="fabric-and-textile">
      <img src="/assets/products/112570/112570-1-2ee7f93c.webp" alt="Orlando Sun Visor" loading="lazy">
      <div><h2>Orlando Sun Visor</h2><p>PLU 112570</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/headwear/sports-headwear/fabric-and-textile/sports-mesh-visor/" data-name="sports mesh visor" data-plu="121796" data-material="fabric-and-textile">
      <img src="/assets/products/121796/121796-1-cd349e1a.webp" alt="Sports Mesh Visor" loading="lazy">
      <div><h2>Sports Mesh Visor</h2><p>PLU 121796</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
