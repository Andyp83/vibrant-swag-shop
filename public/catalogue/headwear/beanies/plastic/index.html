<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beanies · Plastic</title>
  <meta name="description" content="4 products in Headwear / Beanies / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Beanies · Plastic</h1>
        <p>4 products in Headwear / Beanies / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/headwear/beanies/plastic/sherpa-headwear/" data-name="sherpa headwear" data-plu="110507" data-material="plastic">
      <img src="/assets/products/110507/110507-1-0254aa8f.webp" alt="Sherpa Headwear" loading="lazy">
      <div><h2>Sherpa Headwear</h2><p>PLU 110507</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/headwear/beanies/plastic/melody-bluetooth-beanie/" data-name="melody bluetooth beanie" data-plu="116333" data-material="plastic">
      <img src="/assets/products/116333/116333-1-c3bf7e2a.webp" alt="Melody Bluetooth Beanie" loading="lazy">
      <div><h2>Melody Bluetooth Beanie</h2><p>PLU 116333</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/headwear/beanies/plastic/swiss-peak-rpet-beanie/" data-name="swiss peak rpet beanie" data-plu="127627" data-material="plastic">
      <img src="/assets/products/127627/127627-1-31ab6446.webp" alt="Swiss Peak RPET Beanie" loading="lazy">
      <div><h2>Swiss Peak RPET Beanie</h2><p>PLU 127627</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/headwear/beanies/plastic/frontier-ridge-beanie/" data-name="frontier ridge beanie" data-plu="129621" data-material="plastic">
      <img src="/assets/products/129621/129621-1-c616abaa.webp" alt="Frontier Ridge Beanie" loading="lazy">
      <div><h2>Frontier Ridge Beanie</h2><p>PLU 129621</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
