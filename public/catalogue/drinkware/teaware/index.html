<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drinkware · Teaware</title>
  <meta name="description" content="2 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Drinkware · Teaware</h1>
        <p>2 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/drinkware/teaware/metal/">Metal <span>1</span></a><a href="/catalogue/drinkware/teaware/paper-and-cardboard/">Paper &amp; Cardboard <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/drinkware/teaware/paper-and-cardboard/natura-bamboo-tea-box/" data-name="natura bamboo tea box" data-plu="122277" data-material="paper-and-cardboard">
      <img src="/assets/products/122277/122277-1-d23db222.webp" alt="NATURA Bamboo Tea Box" loading="lazy">
      <div><h2>NATURA Bamboo Tea Box</h2><p>PLU 122277</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/drinkware/teaware/metal/travel-tea-infuser/" data-name="travel tea infuser" data-plu="122428" data-material="metal">
      <img src="/assets/products/122428/122428-1-d0126fdc.webp" alt="Travel Tea Infuser" loading="lazy">
      <div><h2>Travel Tea Infuser</h2><p>PLU 122428</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
