<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leisure · Chairs</title>
  <meta name="description" content="3 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Leisure · Chairs</h1>
        <p>3 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/leisure/chairs/metal/">Metal <span>3</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/chairs/metal/quebec-folding-stool/" data-name="quebec folding stool" data-plu="113243" data-material="metal">
      <img src="/assets/products/113243/113243-1-e84d3d19.webp" alt="Quebec Folding Stool" loading="lazy">
      <div><h2>Quebec Folding Stool</h2><p>PLU 113243</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/leisure/chairs/metal/niagara-folding-chair/" data-name="niagara folding chair" data-plu="117602" data-material="metal">
      <img src="/assets/products/117602/117602-1-ce1eaca3.webp" alt="Niagara Folding Chair" loading="lazy">
      <div><h2>Niagara Folding Chair</h2><p>PLU 117602</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/leisure/chairs/metal/frontier-lightweight-folding-chair/" data-name="frontier lightweight folding chair" data-plu="129379" data-material="metal">
      <img src="/assets/products/129379/129379-1-4ed7fbaa.webp" alt="Frontier Lightweight Folding Chair" loading="lazy">
      <div><h2>Frontier Lightweight Folding Chair</h2><p>PLU 129379</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
