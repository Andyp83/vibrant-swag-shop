<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coasters · Natural</title>
  <meta name="description" content="3 products in Leisure / Coasters / Natural.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Coasters · Natural</h1>
        <p>3 products in Leisure / Coasters / Natural.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/coasters/natural/bamboo-coasters/" data-name="bamboo coasters" data-plu="112030" data-material="natural">
      <img src="/assets/products/112030/112030-1-e509fed0.webp" alt="Bamboo Coasters" loading="lazy">
      <div><h2>Bamboo Coasters</h2><p>PLU 112030</p><p>Natural</p></div>
    </a><a class="product-card" href="/catalogue/leisure/coasters/natural/oakridge-cork-coaster-square/" data-name="oakridge cork coaster - square" data-plu="112966" data-material="natural">
      <img src="/assets/products/112966/112966-1-fce1dfdb.webp" alt="Oakridge Cork Coaster - Square" loading="lazy">
      <div><h2>Oakridge Cork Coaster - Square</h2><p>PLU 112966</p><p>Natural</p></div>
    </a><a class="product-card" href="/catalogue/leisure/coasters/natural/oakridge-cork-coaster-round/" data-name="oakridge cork coaster - round" data-plu="112967" data-material="natural">
      <img src="/assets/products/112967/112967-1-20e129ba.webp" alt="Oakridge Cork Coaster - Round" loading="lazy">
      <div><h2>Oakridge Cork Coaster - Round</h2><p>PLU 112967</p><p>Natural</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
