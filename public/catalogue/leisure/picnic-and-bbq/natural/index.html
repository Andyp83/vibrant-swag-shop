<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picnic &amp; BBQ · Natural</title>
  <meta name="description" content="2 products in Leisure / Picnic &amp; BBQ / Natural.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Picnic &amp; BBQ · Natural</h1>
        <p>2 products in Leisure / Picnic &amp; BBQ / Natural.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/picnic-and-bbq/natural/tumbling-tower/" data-name="tumbling tower" data-plu="113085" data-material="natural">
      <img src="/assets/products/113085/113085-1-d513f812.webp" alt="Tumbling Tower" loading="lazy">
      <div><h2>Tumbling Tower</h2><p>PLU 113085</p><p>Natural</p></div>
    </a><a class="product-card" href="/catalogue/leisure/picnic-and-bbq/natural/tic-tac-toe-game/" data-name="tic tac toe game" data-plu="118781" data-material="natural">
      <img src="/assets/products/118781/118781-1-d4ecdf2e.webp" alt="Tic Tac Toe Game" loading="lazy">
      <div><h2>Tic Tac Toe Game</h2><p>PLU 118781</p><p>Natural</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
