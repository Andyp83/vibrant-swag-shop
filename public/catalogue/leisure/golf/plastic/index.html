<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf · Plastic</title>
  <meta name="description" content="3 products in Leisure / Golf / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Golf · Plastic</h1>
        <p>3 products in Leisure / Golf / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/golf/plastic/plastic-golf-ball-marker/" data-name="plastic golf ball marker" data-plu="100648" data-material="plastic">
      <img src="/assets/products/100648/100648-1-1639940e.webp" alt="Plastic Golf Ball Marker" loading="lazy">
      <div><h2>Plastic Golf Ball Marker</h2><p>PLU 100648</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/leisure/golf/plastic/golf-mate/" data-name="golf mate" data-plu="108536" data-material="plastic">
      <img src="/assets/products/108536/108536-1-5e2d6578.webp" alt="Golf Mate" loading="lazy">
      <div><h2>Golf Mate</h2><p>PLU 108536</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/leisure/golf/plastic/caddie-golf-club-cleaning-tool/" data-name="caddie golf club cleaning tool" data-plu="129576" data-material="plastic">
      <img src="/assets/products/129576/129576-1-1659d8df.webp" alt="Caddie Golf Club Cleaning Tool" loading="lazy">
      <div><h2>Caddie Golf Club Cleaning Tool</h2><p>PLU 129576</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
