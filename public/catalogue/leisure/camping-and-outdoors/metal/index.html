<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="4 products in Leisure / Camping &amp; Outdoors / Metal.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Camping &amp; Outdoors · Metal</h1>
        <p>4 products in Leisure / Camping &amp; Outdoors / Metal.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/metal/nebula-torch/" data-name="nebula torch" data-plu="106177" data-material="metal">
      <img src="/assets/products/106177/106177-1-e4fdba31.webp" alt="Nebula Torch" loading="lazy">
      <div><h2>Nebula Torch</h2><p>PLU 106177</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/metal/swiss-peak-10w-cree-torch/" data-name="swiss peak 10w cree torch" data-plu="112174" data-material="metal">
      <img src="/assets/products/112174/112174-1-74eda44b.webp" alt="Swiss Peak 10W Cree Torch" loading="lazy">
      <div><h2>Swiss Peak 10W Cree Torch</h2><p>PLU 112174</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/metal/multi-tool-card/" data-name="multi-tool card" data-plu="116111" data-material="metal">
      <img src="/assets/products/116111/116111-1-079edc0e.webp" alt="Multi-Tool Card" loading="lazy">
      <div><h2>Multi-Tool Card</h2><p>PLU 116111</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/metal/waitomo-torch/" data-name="waitomo torch" data-plu="120584" data-material="metal">
      <img src="/assets/products/120584/120584-1-1ef3263d.webp" alt="Waitomo Torch" loading="lazy">
      <div><h2>Waitomo Torch</h2><p>PLU 120584</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
