<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camping &amp; Outdoors · Natural</title>
  <meta name="description" content="2 products in Leisure / Camping &amp; Outdoors / Natural.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Camping &amp; Outdoors · Natural</h1>
        <p>2 products in Leisure / Camping &amp; Outdoors / Natural.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/natural/pick-up-sticks-game/" data-name="pick up sticks game" data-plu="117604" data-material="natural">
      <img src="/assets/products/117604/117604-1-14486eba.webp" alt="Pick Up Sticks Game" loading="lazy">
      <div><h2>Pick Up Sticks Game</h2><p>PLU 117604</p><p>Natural</p></div>
    </a><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/natural/dominoes-game/" data-name="dominoes game" data-plu="117605" data-material="natural">
      <img src="/assets/products/117605/117605-1-d282917c.webp" alt="Dominoes Game" loading="lazy">
      <div><h2>Dominoes Game</h2><p>PLU 117605</p><p>Natural</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
