<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camping &amp; Outdoors · Fabric &amp; Textile</title>
  <meta name="description" content="2 products in Leisure / Camping &amp; Outdoors / Fabric &amp; Textile.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Camping &amp; Outdoors · Fabric &amp; Textile</h1>
        <p>2 products in Leisure / Camping &amp; Outdoors / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/fabric-and-textile/kubb-wooden-game/" data-name="kubb wooden game" data-plu="121851" data-material="fabric-and-textile">
      <img src="/assets/products/121851/121851-1-4676efe0.webp" alt="Kubb Wooden Game" loading="lazy">
      <div><h2>Kubb Wooden Game</h2><p>PLU 121851</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/leisure/camping-and-outdoors/fabric-and-textile/wooden-yard-dice-game/" data-name="wooden yard dice game" data-plu="122282" data-material="fabric-and-textile">
      <img src="/assets/products/122282/122282-1-950d4bb6.webp" alt="Wooden Yard Dice Game" loading="lazy">
      <div><h2>Wooden Yard Dice Game</h2><p>PLU 122282</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
