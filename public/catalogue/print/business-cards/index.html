<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print · Business Cards</title>
  <meta name="description" content="3 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Print · Business Cards</h1>
        <p>3 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/print/business-cards/general/">General <span>2</span></a><a href="/catalogue/print/business-cards/plastic/">Plastic <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/print/business-cards/plastic/card-magnifier/" data-name="card magnifier" data-plu="104666" data-material="plastic">
      <img src="/assets/products/104666/104666-1-bb3145cd.webp" alt="Card Magnifier" loading="lazy">
      <div><h2>Card Magnifier</h2><p>PLU 104666</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/print/business-cards/general/full-colour-business-cards/" data-name="full colour business cards" data-plu="116459" data-material="general">
      <img src="/assets/products/116459/116459-1-8b3c4709.webp" alt="Full Colour Business Cards" loading="lazy">
      <div><h2>Full Colour Business Cards</h2><p>PLU 116459</p><p>General</p></div>
    </a><a class="product-card" href="/catalogue/print/business-cards/general/full-colour-loyalty-cards/" data-name="full colour loyalty cards" data-plu="123378" data-material="general">
      <img src="/assets/products/123378/123378-1-24832a4f.webp" alt="Full Colour Loyalty Cards" loading="lazy">
      <div><h2>Full Colour Loyalty Cards</h2><p>PLU 123378</p><p>General</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
