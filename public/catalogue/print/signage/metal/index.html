<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signage · Metal</title>
  <meta name="description" content="4 products in Print / Signage / Metal.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Signage · Metal</h1>
        <p>4 products in Print / Signage / Metal.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/print/signage/metal/600x900-metal-a-frame/" data-name="600x900 metal a-frame" data-plu="126782" data-material="metal">
      <img src="/assets/products/126782/126782-1-244bdd2b.webp" alt="600x900 Metal A-Frame" loading="lazy">
      <div><h2>600x900 Metal A-Frame</h2><p>PLU 126782</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/print/signage/metal/900x1200-metal-a-frame/" data-name="900x1200 metal a-frame" data-plu="126783" data-material="metal">
      <img src="/assets/products/126783/126783-1-ae69dba4.webp" alt="900x1200 Metal A-Frame" loading="lazy">
      <div><h2>900x1200 Metal A-Frame</h2><p>PLU 126783</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/print/signage/metal/600x900-insertable-a-frame/" data-name="600x900 insertable a-frame" data-plu="126784" data-material="metal">
      <img src="/assets/products/126784/126784-1-c665ab0e.webp" alt="600x900 Insertable A-Frame" loading="lazy">
      <div><h2>600x900 Insertable A-Frame</h2><p>PLU 126784</p><p>Metal</p></div>
    </a><a class="product-card" href="/catalogue/print/signage/metal/900x1200-insertable-a-frame/" data-name="900x1200 insertable a-frame" data-plu="126785" data-material="metal">
      <img src="/assets/products/126785/126785-1-92dfd703.webp" alt="900x1200 Insertable A-Frame" loading="lazy">
      <div><h2>900x1200 Insertable A-Frame</h2><p>PLU 126785</p><p>Metal</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
