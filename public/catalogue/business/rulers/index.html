<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business · Rulers</title>
  <meta name="description" content="3 products split by material/style.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Business · Rulers</h1>
        <p>3 products split by material/style.</p>
        <div class="section-pills"><a href="/catalogue/business/rulers/paper-and-cardboard/">Paper &amp; Cardboard <span>2</span></a><a href="/catalogue/business/rulers/plastic/">Plastic <span>1</span></a></div>
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/rulers/paper-and-cardboard/bamboo-ruler-bookmark-round/" data-name="bamboo ruler bookmark - round" data-plu="121725" data-material="paper-and-cardboard">
      <img src="/assets/products/121725/121725-1-e8b5c10d.webp" alt="Bamboo Ruler Bookmark - Round" loading="lazy">
      <div><h2>Bamboo Ruler Bookmark - Round</h2><p>PLU 121725</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/business/rulers/paper-and-cardboard/bamboo-ruler-bookmark-square/" data-name="bamboo ruler bookmark - square" data-plu="121726" data-material="paper-and-cardboard">
      <img src="/assets/products/121726/121726-1-5e6368a9.webp" alt="Bamboo Ruler Bookmark - Square" loading="lazy">
      <div><h2>Bamboo Ruler Bookmark - Square</h2><p>PLU 121726</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/business/rulers/plastic/choice-ruler-30cm/" data-name="choice ruler - 30cm" data-plu="123154" data-material="plastic">
      <img src="/assets/products/123154/123154-1-8204f91b.webp" alt="Choice Ruler - 30cm" loading="lazy">
      <div><h2>Choice Ruler - 30cm</h2><p>PLU 123154</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
