<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Items · Plastic</title>
  <meta name="description" content="2 products in Business / Desk Items / Plastic.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Desk Items · Plastic</h1>
        <p>2 products in Business / Desk Items / Plastic.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/desk-items/plastic/natura-oaken-wireless-charger-desk-caddy/" data-name="natura oaken wireless charger desk caddy" data-plu="121839" data-material="plastic">
      <img src="/assets/products/121839/121839-1-8b5cb183.webp" alt="NATURA Oaken Wireless Charger Desk Caddy" loading="lazy">
      <div><h2>NATURA Oaken Wireless Charger Desk Caddy</h2><p>PLU 121839</p><p>Plastic</p></div>
    </a><a class="product-card" href="/catalogue/business/desk-items/plastic/natura-bamboo-phone-stand-desk-caddy/" data-name="natura bamboo phone stand desk caddy" data-plu="127793" data-material="plastic">
      <img src="/assets/products/127793/127793-1-357e9ea6.webp" alt="NATURA Bamboo Phone Stand Desk Caddy" loading="lazy">
      <div><h2>NATURA Bamboo Phone Stand Desk Caddy</h2><p>PLU 127793</p><p>Plastic</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
