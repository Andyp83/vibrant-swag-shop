<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Items · Paper &amp; Cardboard</title>
  <meta name="description" content="2 products in Business / Desk Items / Paper &amp; Cardboard.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Desk Items · Paper &amp; Cardboard</h1>
        <p>2 products in Business / Desk Items / Paper &amp; Cardboard.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/desk-items/paper-and-cardboard/a2-desk-planner-25-leaves/" data-name="a2 desk planner - 25 leaves" data-plu="111766" data-material="paper-and-cardboard">
      <img src="/assets/products/111766/111766-1-7b0db020.webp" alt="A2 Desk Planner - 25 Leaves" loading="lazy">
      <div><h2>A2 Desk Planner - 25 Leaves</h2><p>PLU 111766</p><p>Paper &amp; Cardboard</p></div>
    </a><a class="product-card" href="/catalogue/business/desk-items/paper-and-cardboard/a2-desk-planner-50-leaves/" data-name="a2 desk planner - 50 leaves" data-plu="115827" data-material="paper-and-cardboard">
      <img src="/assets/products/115827/115827-1-f6cf7890.webp" alt="A2 Desk Planner - 50 Leaves" loading="lazy">
      <div><h2>A2 Desk Planner - 50 Leaves</h2><p>PLU 115827</p><p>Paper &amp; Cardboard</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
