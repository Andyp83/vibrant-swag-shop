<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Items · Fabric &amp; Textile</title>
  <meta name="description" content="3 products in Business / Desk Items / Fabric &amp; Textile.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Desk Items · Fabric &amp; Textile</h1>
        <p>3 products in Business / Desk Items / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/desk-items/fabric-and-textile/precision-mouse-mat/" data-name="precision mouse mat" data-plu="105296" data-material="fabric-and-textile">
      <img src="/assets/products/105296/105296-1-5222083a.webp" alt="Precision Mouse Mat" loading="lazy">
      <div><h2>Precision Mouse Mat</h2><p>PLU 105296</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/desk-items/fabric-and-textile/4-in-1-mouse-mat/" data-name="4-in-1 mouse mat" data-plu="110542" data-material="fabric-and-textile">
      <img src="/assets/products/110542/110542-1-cb0c358a.webp" alt="4-in-1 Mouse Mat" loading="lazy">
      <div><h2>4-in-1 Mouse Mat</h2><p>PLU 110542</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/desk-items/fabric-and-textile/jumbo-desk-mat/" data-name="jumbo desk mat" data-plu="116471" data-material="fabric-and-textile">
      
      <div><h2>Jumbo Desk Mat</h2><p>PLU 116471</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
