<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stationery · Fabric &amp; Textile</title>
  <meta name="description" content="3 products in Business / Stationery / Fabric &amp; Textile.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Stationery · Fabric &amp; Textile</h1>
        <p>3 products in Business / Stationery / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/stationery/fabric-and-textile/puma-pencil-case/" data-name="puma pencil case" data-plu="108491" data-material="fabric-and-textile">
      <img src="/assets/products/108491/108491-1-2c1b0f8c.webp" alt="Puma Pencil Case" loading="lazy">
      <div><h2>Puma Pencil Case</h2><p>PLU 108491</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/stationery/fabric-and-textile/radius-pencil-case/" data-name="radius pencil case" data-plu="109030" data-material="fabric-and-textile">
      <img src="/assets/products/109030/109030-1-a1de1485.webp" alt="Radius Pencil Case" loading="lazy">
      <div><h2>Radius Pencil Case</h2><p>PLU 109030</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/stationery/fabric-and-textile/mona-portable-drawing-set/" data-name="mona portable drawing set" data-plu="124211" data-material="fabric-and-textile">
      <img src="/assets/products/124211/124211-1-1e9281a3.webp" alt="Mona Portable Drawing Set" loading="lazy">
      <div><h2>Mona Portable Drawing Set</h2><p>PLU 124211</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
