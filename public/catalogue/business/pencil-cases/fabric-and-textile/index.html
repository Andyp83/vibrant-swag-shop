<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencil Cases · Fabric &amp; Textile</title>
  <meta name="description" content="3 products in Business / Pencil Cases / Fabric &amp; Textile.">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <header class="topbar">
      <a class="brand" href="/catalogue/"><span class="brand-mark"></span><span>Mini Merch</span></a>
      <nav aria-label="Primary"><a href="/catalogue/">Catalogue</a><a href="/quote.html">Request Quote</a></nav>
    </header>
    

    <main>
      <section class="catalogue-head">
        <h1>Pencil Cases · Fabric &amp; Textile</h1>
        <p>3 products in Business / Pencil Cases / Fabric &amp; Textile.</p>
        
        <div class="catalogue-tools"><input id="search" type="search" placeholder="Search product or PLU"><select id="material"><option value="">All materials</option></select></div>
      </section>
      <section class="product-grid" id="product-grid"><a class="product-card" href="/catalogue/business/pencil-cases/fabric-and-textile/radius-pencil-case-full-colour/" data-name="radius pencil case - full colour" data-plu="117124" data-material="fabric-and-textile">
      <img src="/assets/products/117124/117124-1-88c26652.webp" alt="Radius Pencil Case - Full Colour" loading="lazy">
      <div><h2>Radius Pencil Case - Full Colour</h2><p>PLU 117124</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/pencil-cases/fabric-and-textile/oakridge-pencil-case/" data-name="oakridge pencil case" data-plu="117807" data-material="fabric-and-textile">
      <img src="/assets/products/117807/117807-1-fa9db652.webp" alt="Oakridge Pencil Case" loading="lazy">
      <div><h2>Oakridge Pencil Case</h2><p>PLU 117807</p><p>Fabric &amp; Textile</p></div>
    </a><a class="product-card" href="/catalogue/business/pencil-cases/fabric-and-textile/tutor-pencil-case/" data-name="tutor pencil case" data-plu="200244" data-material="fabric-and-textile">
      <img src="/assets/products/200244/200244-1-586d954d.webp" alt="Tutor Pencil Case" loading="lazy">
      <div><h2>Tutor Pencil Case</h2><p>PLU 200244</p><p>Fabric &amp; Textile</p></div>
    </a></section>
    </main>
    

    <script>
      const search = document.getElementById('search');
      const material = document.getElementById('material');
      const cards = Array.from(document.querySelectorAll('.product-card'));
      const materials = Array.from(new Set(cards.map((card) => card.dataset.material).filter(Boolean))).sort();
      materials.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
        material.appendChild(option);
      });
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const mat = material.value;
        cards.forEach((card) => {
          const matchesQuery = !q || card.dataset.name.includes(q) || card.dataset.plu.includes(q);
          const matchesMaterial = !mat || card.dataset.material === mat;
          card.hidden = !(matchesQuery && matchesMaterial);
        });
      }
      search.addEventListener('input', applyFilters);
      material.addEventListener('change', applyFilters);
    </script>
    
</body>
</html>
